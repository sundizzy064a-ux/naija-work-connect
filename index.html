<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAGAMU BIZ FINDER</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:#f8f8fa}
.header{background:#111;border-radius:0 0 20px 20px;padding:22px 16px;text-align:center;color:#fff}
.header h1{font-size:22px}.header p{font-size:13px;opacity:.9;margin-top:4px}
.search{margin:-18px 14px 10px;background:#fff;border-radius:14px;padding:12px;display:flex;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.08);border:1px solid #eee}
.search input{flex:1;border:0;outline:0;font-size:15px}
.chips{display:flex;gap:8px;overflow:auto;padding:8px 14px;white-space:nowrap;scrollbar-width:none}
.chip{padding:7px 12px;border-radius:20px;background:#eee;border:1px solid #e5e7eb;font-size:12px;font-weight:600}
.chip.active{background:#111;color:#fff}
.card{background:#fff;margin:10px 14px;border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid #f0f0f0}
.tag{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700;margin-right:4px}
.t1{background:#e9e7ff;color:#4f46e5}.t2{background:#ffedd5;color:#9a3412}
.name{font-weight:800;margin:6px 0 2px}.desc{font-size:13px;color:#555}
.phone{font-weight:800;margin-top:6px;font-size:14px}
.btns{display:flex;gap:8px;margin-top:10px}.b{flex:1;padding:12px;border-radius:12px;border:0;font-weight:800;text-align:center;text-decoration:none;display:block}
.wa{background:#22c55e;color:#fff}.cl{background:#111;color:#fff}
.add{position:fixed;bottom:16px;right:16px;background:#111;color:#fff;width:56px;height:56px;border-radius:50%;font-size:28px;border:0;z-index:10}
#form{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);padding:20px;overflow:auto;z-index:20}
#form>div{background:#fff;border-radius:16px;padding:16px}input,select,textarea{width:100%;padding:10px;margin-top:6px;border-radius:10px;border:1px solid #ddd}
</style>
</head>
<body>
<div class="header">
<h1>SAGAMU BIZ FINDER</h1>
<p>Find businesses in Oju Mele - Ewuoliwo - Sabo - Makun - Ajaka - Isale</p>
</div>
<div class="search">🔍<input id="q" placeholder="Search Salon, Food, POS, Fashion..." oninput="render()"></div>
<div class="chips" id="chips"></div>
<div id="list"></div>
<button class="add" onclick="document.getElementById('form').style.display='block'">+</button>
<div id="form"><div>
<h3>Add Your Business</h3>
<input id="fName" placeholder="Business Name">
<select id="fCat"><option>Salon</option><option>Food</option><option>Finance</option><option>POS</option><option>Fashion</option><option>Phone</option><option>Barbing</option><option>Tailor</option><option>Mechanic</option></select>
<select id="fLoc"><option>Oju Mele</option><option>Ewuoliwo</option><option>Sabo</option><option>Makun</option><option>Ajaka</option><option>Isale Oko</option><option>GRA</option><option>High Court</option><option>Ogijo</option><option>Sotubo</option></select>
<input id="fPhone" placeholder="Phone e.g 09167914778">
<input id="fDesc" placeholder="What you do?">
<button class="b cl" style="margin-top:10px;width:100%" onclick="saveBiz()">Save Business (Show for Everybody)</button>
<button class="b" style="margin-top:6px;width:100%;background:#eee" onclick="document.getElementById('form').style.display='none'">Close</button>
</div></div>
<script>
const locs=["All","Oju Mele","Ewuoliwo","Sabo","Makun","Ajaka","Isale Oko","GRA","High Court","Ogijo","Sotubo"];
let cur="All";
let biz=JSON.parse(localStorage.getItem('sagamu_biz')||'null')||[
{name:"BODE DE WAY UNISEX SALON",cat:"Salon",loc:"Oju Mele",phone:"09167914778",desc:"Unisex salon for Oju Mele - Haircut, weaving, styling. Look fresh!"},
{name:"Ewuoliwo POS & Transfer",cat:"Finance",loc:"Ewuoliwo",phone:"08000000001",desc:"POS and transfer - Fast service"},
{name:"Sabo Mama Put",cat:"Food",loc:"Sabo",phone:"08000000002",desc:"Hot food - Rice, Swallow, Soup"},
{name:"Makun Fashion Hub",cat:"Fashion",loc:"Makun",phone:"08100000003",desc:"Clothes, shoes, bags"}
];
function chipRender(){
 document.getElementById('chips').innerHTML=locs.map(l=>`<button class="chip ${cur===l?'active':''}" onclick="cur='${l}';chipRender();render()">${l}</button>`).join('');
}
function render(){
 let q=document.getElementById('q').value.toLowerCase();
 let f=biz.filter(b=>{
  let okLoc=cur==="All"||b.loc===cur;
  let okQ=!q||b.name.toLowerCase().includes(q)||b.cat.toLowerCase().includes(q)||b.desc.toLowerCase().includes(q)||b.loc.toLowerCase().includes(q);
  return okLoc&&okQ;
 });
 document.getElementById('list').innerHTML=f.map(b=>`
 <div class="card">
  <span class="tag t1">${b.cat}</span><span class="tag t2">${b.loc}</span>
  <div class="name">${b.name}</div>
  <div class="desc">${b.desc}</div>
  <div class="phone">📞 ${b.phone} - ${b.loc}, Sagamu</div>
  <div class="btns">
   <a class="b wa" href="https://wa.me/234${b.phone.slice(1)}?text=Hello from Sagamu Biz Finder">WhatsApp</a>
   <a class="b cl" href="tel:${b.phone}">Call</a>
  </div>
 </div>`).join('')||`<p style="text-align:center;padding:20px;color:#888">No business found for ${cur}</p>`;
}
function saveBiz(){
 let n=document.getElementById('fName').value,c=document.getElementById('fCat').value,l=document.getElementById('fLoc').value,p=document.getElementById('fPhone').value,d=document.getElementById('fDesc').value;
 if(!n||!p)return alert('Put name and phone');
 let nb={name:n,cat:c,loc:l,phone:p,desc:d};
 biz.unshift(nb);
 localStorage.setItem('sagamu_biz',JSON.stringify(biz));
 try{fetch('https://ntfy.sh/sagamu-biz-2026',{method:'POST',body:'ADD:'+JSON.stringify(nb)})}catch{}
 document.getElementById('form').style.display='none';render();
 alert('Added! Now everybody go see am.');
}
chipRender();render();
try{
 let es=new EventSource('https://ntfy.sh/sagamu-biz-2026/sse');
 es.onmessage=e=>{
  let d=e.data;
  if(d.startsWith('ADD:')){try{let b=JSON.parse(d.replace('ADD:',''));if(!biz.find(x=>x.phone===b.phone)){biz.unshift(b);localStorage.setItem('sagamu_biz',JSON.stringify(biz));render();}}catch{}}
 };
}catch{}
</script>
</body>
</html>
