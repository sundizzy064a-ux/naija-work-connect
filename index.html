<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEWBIZ - NEW MARKET WORLDWIDE</title>
<meta name="theme-color" content="#FF6600">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f8f9fa;margin:0}
.header{background:#111;color:white;padding:22px;text-align:center}
.market-banner{background:#FF6600;color:white;padding:10px;text-align:center;font-weight:bold}
.pay-bar{background:white;margin:12px;padding:12px;border-radius:12px;text-align:center;box-shadow:0 2px 8px #0001}
.pay-bar b{color:#FF6600;font-size:18px}
.search{padding:10px}
.search input{width:100%;padding:13px;border-radius:25px;border:1px solid #ddd}
.cats{display:flex;overflow-x:auto;gap:6px;padding:10px}
.cats span{background:white;padding:7px 14px;border-radius:20px;border:1px solid #eee;font-size:13px;white-space:nowrap;cursor:pointer}
.cats span.active{background:#FF6600;color:white}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;padding-bottom:90px}
.biz{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px #0001}
.biz-top{height:80px;display:flex;align-items:center;justify-content:center;font-size:36px;background:#fff3e6}
.biz-info{padding:8px}
.biz-info h4{margin:0;font-size:13px}
.biz-info small{color:#666;font-size:11px}
.btn{width:100%;padding:7px;border:none;border-radius:7px;margin-top:5px;font-weight:bold;color:white;font-size:11px;background:#FF6600}
.add{position:fixed;bottom:0;left:0;right:0;background:#111;color:white;padding:16px;text-align:center;font-weight:bold}
</style>
</head>
<body>
<div class="header">NEWBIZ<br><small>NEW MARKET WORLDWIDE DIRECTORY</small></div>
<div class="market-banner">WORLDWIDE BUSINESS - CONTACT ADMIN FIRST</div>
<div class="pay-bar"><b>Pay ₦2000 Only - OPay 9013627287</b><br><small>Contact Admin First To Get Customers - If you want me to add you so you see customer, na me you go first meet</small></div>
<div class="search"><input id="searchBox" placeholder="Search any country, state, city, business..." oninput="filterBiz()"></div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div class="add" onclick="addBiz()">+ ADD YOUR BUSINESS - PAY ₦2000 FIRST</div>
<script>
let businesses=[
{name:"Bode De Way Unisa Salon",cat:"Barber",loc:"Makun, Sagamu",country:"Nigeria",state:"Ogun",city:"Sagamu",emoji:"💈"},
{name:"Mama T Braids",cat:"Salon",loc:"Sabo, Sagamu",country:"Nigeria",state:"Ogun",city:"Sagamu",emoji:"💇‍♀️"},
{name:"Tunde Barber",cat:"Barber",loc:"Sabo, Sagamu",country:"Nigeria",state:"Ogun",city:"Sagamu",emoji:"✂️"},
{name:"Lagos Fashion Hub",cat:"Fashion",loc:"Ikeja, Lagos",country:"Nigeria",state:"Lagos",city:"Lagos",emoji:"👗"},
{name:"Sagamu Market Rice",cat:"Food",loc:"Sagamu Market",country:"Nigeria",state:"Ogun",city:"Sagamu",emoji:"🍚"},
{name:"Accra Tech Hub",cat:"Tech",loc:"Accra",country:"Ghana",state:"Accra",city:"Accra",emoji:"💻"},
{name:"London Foods",cat:"Food",loc:"London",country:"UK",state:"London",city:"London",emoji:"🍔"},
{name:"USA Tailor",cat:"Tailor",loc:"New York",country:"USA",state:"NY",city:"NY",emoji:"🧵"}
];
let cats=["All","Nigeria","Ghana","USA","UK","Canada","Ogun","Lagos","Sagamu","Barber","Salon","Fashion","Food","Tech","Tailor"];
let active="All";
function renderCats(){
document.getElementById('cats').innerHTML=cats.map(c=>`<span class="${c===active?'active':''}" onclick="setCat('${c}')">${c}</span>`).join('');
}
function setCat(c){active=c;renderCats();filterBiz();}
function filterBiz(){
let q=document.getElementById('searchBox').value.toLowerCase();
let f=businesses.filter(b=>{
let matchCat=active==="All"||b.country===active||b.state===active||b.city===active||b.cat===active;
let matchSearch=q===""||(b.name+b.cat+b.loc+b.country+b.state+b.city).toLowerCase().includes(q);
return matchCat&&matchSearch;
});
document.getElementById('grid').innerHTML=f.map(b=>`
<div class="biz">
<div class="biz-top">${b.emoji}</div>
<div class="biz-info">
<h4>${b.name}</h4>
<small>${b.cat} • ${b.loc}</small><br>
<small>${b.country} - ${b.city}</small>
<button class="btn" onclick="contactAdmin('${b.name}')">Contact Admin - ₦2000</button>
</div>
</div>
`).join('');
}
function contactAdmin(bizName){
let admin="2349013627287";
let msg=`Hello Admin NEWBIZ, I want to connect with ${bizName}. I want to see customer/business. If I want you to add me to app so I can see customer, na you I go first meet. My name is: `;
window.open(`https://wa.me/${admin}?text=${encodeURIComponent(msg)}`,'_blank');
}
function addBiz(){
let name=prompt("Your Business Name:");
if(!name)return;
let cat=prompt("Business Type (Barber, Salon, Fashion, etc):");
let city=prompt("City (e.g Sagamu):")||"Sagamu";
let state=prompt("State (e.g Ogun):")||"Ogun";
let country=prompt("Country (Nigeria, Ghana, USA, UK, Canada):")||"Nigeria";
let newB={name,cat,loc:city,country,state,city,emoji:"🏪"};
businesses.unshift(newB);
filterBiz();
let admin="2349013627287";
let msg=`NEW BUSINESS ALERT NEWBIZ NEW MARKET!%0AName: ${name}%0AType: ${cat}%0ACity: ${city}%0AState: ${state}%0ACountry: ${country}%0A%0AI have paid ₦2000 to OPay 9013627287. If anybody want me to add am to app make hin dey see customer, na me he go first meet - I want you to add me now.`;
alert("Added! Now send ₦2000 payment proof to Admin on WhatsApp.");
window.open(`https://wa.me/${admin}?text=${msg}`,'_blank');
}
renderCats();
filterBiz();
</script>
</body>
</html>
