<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NG Meet - Real People Only</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #fff; color: #3E2723; padding-bottom: 80px; }
.header { background: #5D4037; color: white; padding: 18px; text-align: center; position: sticky; top:0; z-index: 10; }
.header h1 { font-size: 32px; letter-spacing: 1px; }
.header p { font-size: 18px; margin-top: 5px; opacity: 0.9; }
.real-badge { background: #FFD54F; color: #3E2723; padding: 10px; text-align: center; font-weight: bold; font-size: 19px; }
.container { padding: 15px; max-width: 600px; margin: auto; }
.card { background: white; border: 3px solid #5D4037; border-radius: 18px; margin-bottom: 22px; overflow: hidden; box-shadow: 0 4px 10px rgba(93,64,55,0.2); }
.card img { width: 100%; height: 320px; object-fit: cover; background: #EFEBE9; }
.card-body { padding: 16px; }
.card-body h2 { font-size: 28px; color: #3E2723; }
.card-body p { font-size: 20px; margin: 6px 0; line-height: 1.4; }
.btn { background: #5D4037; color: white; border: none; padding: 16px; width: 100%; border-radius: 12px; font-size: 22px; font-weight: bold; margin-top: 12px; }
.btn-green { background: #2E7D32; }
.btn-outline { background: white; color: #5D4037; border: 3px solid #5D4037; }
input, select, textarea { width: 100%; padding: 18px; margin: 10px 0; border: 3px solid #5D4037; border-radius: 12px; font-size: 20px; }
.form-box { background: #FFF8E1; border: 3px dashed #5D4037; padding: 18px; border-radius: 18px; margin-bottom: 20px; }
.chat-box { border: 3px solid #5D4037; height: 280px; overflow-y: auto; padding: 12px; border-radius: 12px; background: #FAFAFA; margin: 10px 0; }
.admin-bar { background: #3E2723; color: white; padding: 12px; text-align: center; position: fixed; bottom: 0; width: 100%; max-width: 600px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.admin-bar button { flex: 1; padding: 14px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px; }
</style>
</head>
<body>
<div class="header">
<h1>🤎 NG MEET 🤎</h1>
<p>Real Workers Only - Lagos</p>
</div>
<div class="real-badge">✅ REAL PEOPLE ONLY - NO FAKE - HOME ADDRESS NEEDED</div>

<div class="container" id="app"></div>

<div class="admin-bar">
<button onclick="showPage('home')" style="background:white;color:#3E2723;">HOME</button>
<button onclick="showPage('signup')" style="background:#FFD54F;color:#3E2723;">SIGN UP</button>
<button onclick="showPage('admin')" style="background:#D32F2F;color:white;">ADMIN</button>
</div>

<script>
let workers = JSON.parse(localStorage.getItem('ng_real')||'[]');
let chats = JSON.parse(localStorage.getItem('ng_chat')||'{}');
let currentChat = null;

function save(){ localStorage.setItem('ng_real', JSON.stringify(workers)); localStorage.setItem('ng_chat', JSON.stringify(chats)); }

function showPage(p){
 if(p==='home') renderHome();
 if(p==='signup') renderSignup();
 if(p==='admin') renderAdmin();
}

function renderHome(){
 let approved = workers.filter(w=>w.approved);
 let html = `<h2 style="font-size:28px;margin:15px 0;">👷 Approved Workers (${approved.length})</h2>`;
 if(approved.length===0) html+=`<div style="padding:40px;text-align:center;font-size:22px;">No worker yet. Make them sign up first, you go approve for Admin.</div>`;
 approved.forEach((w,i)=>{
   let idx = workers.indexOf(w);
   html+=`<div class="card">
   <img src="${w.photo||'https://via.placeholder.com/400x400/5D4037/FFFFFF?text='+w.name}">
   <div class="card-body">
   <h2>${w.name} ${w.approved?'✅':''}</h2>
   <p>🔧 <b>${w.work}</b></p>
   <p>📍 ${w.address}</p>
   <p>📞 ${w.phone}</p>
   <button class="btn" onclick="openChat(${idx})">💬 CHAT ${w.name} INSIDE APP</button>
   </div></div>`;
 });
 document.getElementById('app').innerHTML = html;
}

function renderSignup(){
 document.getElementById('app').innerHTML = `
 <div class="form-box">
 <h2 style="font-size:30px;">📝 SIGN UP - REAL PEOPLE ONLY</h2>
 <p style="font-size:18px;margin:10px 0;">We need your home address to confirm you be real person for Lagos. No fake!</p>
 <input id="s_name" placeholder="Your Full Name">
 <input id="s_phone" placeholder="Phone Number - 080...">
 <input id="s_address" placeholder="Your Home Address - e.g. No 12 Allen Avenue, Ikeja">
 <select id="s_work"><option>Plumber</option><option>Electrician</option><option>Cleaner</option><option>Carpenter</option><option>Painter</option><option>Tiler</option><option>Driver</option><option>Others</option></select>
 <input id="s_photo" placeholder="Photo link (or leave empty)">
 <p style="font-size:16px;color:#BF360C;margin-top:10px;">⚠️ After sign up, Oga go approve you before you go show for public. This is to stop fake people.</p>
 <button class="btn btn-green" onclick="doSignup()">✅ SIGN UP & WAIT FOR APPROVAL</button>
 </div>`;
}

function doSignup(){
 let w = { name: document.getElementById('s_name').value, phone: document.getElementById('s_phone').value, address: document.getElementById('s_address').value, work: document.getElementById('s_work').value, photo: document.getElementById('s_photo').value, approved: false };
 if(!w.name||!w.phone||!w.address){ alert('Abeg fill Name, Phone and Home Address - Na compulsory!'); return; }
 workers.push(w); save(); alert('You don sign up! Oga go approve you soon. You no go show for public until approval.'); showPage('home');
}

function renderAdmin(){
 let pending = workers.filter(w=>!w.approved);
 let html = `<h2 style="font-size:28px;">🔑 ADMIN - APPROVE REAL PEOPLE</h2><p style="font-size:18px;">Pending: ${pending.length} people waiting</p>`;
 workers.forEach((w,i)=>{
   html+=`<div class="card"><div class="card-body">
   <h2>${w.name} ${w.approved?'✅ APPROVED':'⏳ PENDING'}</h2>
   <p>Work: ${w.work}</p><p>Phone: ${w.phone}</p><p>Address: <b>${w.address}</b></p>
   ${!w.approved?`<button class="btn btn-green" onclick="approve(${i})">✅ APPROVE THIS REAL PERSON</button><button class="btn btn-outline" onclick="removeWorker(${i})">❌ REJECT / FAKE</button>`:`<button class="btn btn-outline" onclick="removeWorker(${i})">Delete</button>`}
   </div></div>`;
 });
 document.getElementById('app').innerHTML = html;
}

function approve(i){ workers[i].approved=true; save(); renderAdmin(); }
function removeWorker(i){ if(confirm('Delete?')){ workers.splice(i,1); save(); renderAdmin(); } }

function openChat(i){
 currentChat=i;
 let w = workers[i];
 let html = `<div class="card"><div class="card-body">
 <button class="btn btn-outline" onclick="showPage('home')">⬅️ Back</button>
 <h2>💬 Chat with ${w.name}</h2><p>${w.work} - ${w.address}</p>
 <div class="chat-box" id="chatBox"></div>
 <input id="chatInput" placeholder="Type message...">
 <button class="btn" onclick="sendMsg()">Send Message Inside App</button>
 </div></div>`;
 document.getElementById('app').innerHTML = html;
 renderChat();
}
function renderChat(){
 let box = document.getElementById('chatBox');
 if(!box) return;
 let key = 'chat_'+currentChat;
 let msgs = chats[key]||[];
 box.innerHTML = msgs.map(m=>`<div style="padding:10px;margin:8px 0;background:${m.me?'#5D4037':'white'};color:${m.me?'white':'#3E2723'};border-radius:12px;border:2px solid #5D4037;font-size:19px;">${m.text}</div>`).join('');
 box.scrollTop = box.scrollHeight;
}
function sendMsg(){
 let inp = document.getElementById('chatInput');
 if(!inp.value) return;
 let key = 'chat_'+currentChat;
 if(!chats[key]) chats[key]=[];
 chats[key].push({text: inp.value, me:true});
 // auto reply
 setTimeout(()=>{ chats[key].push({text:'Thanks! I be real person for '+workers[currentChat].address+'. We fit meet.', me:false}); save(); renderChat(); }, 800);
 inp.value=''; save(); renderChat();
}
renderHome();
</script>
</body>
</html>
