<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NG MEET</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:SFProDisplay-Regular, Helvetica, Arial, sans-serif;background:#F0F2F5;color:#050505;overflow-x:hidden}
.fb-top{background:#fff;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:30;box-shadow:0 1px 2px rgba(0,0,0,0.1)}
.fb-top h1{color:#1877F2;font-size:30px;font-weight:900;letter-spacing:-1px}
.fb-top-icons{display:flex;gap:10px}
.fb-top-icons div{width:40px;height:40px;background:#F0F2F5;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.lang-strip{background:#fff;padding:8px 10px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid #E4E6EB}
.lang-strip button{padding:6px 12px;border-radius:16px;border:1px solid #1877F2;background:#fff;font-weight:600;font-size:12px;white-space:nowrap}
.lang-strip button.active{background:#1877F2;color:#fff}
.main{max-width:500px;margin:0 auto;background:#F0F2F5;min-height:100vh;padding-bottom:55px}
.story-row{background:#fff;padding:10px;display:flex;gap:8px;overflow-x:auto;border-bottom:1px solid #E4E6EB;margin-bottom:8px}
.story{flex-shrink:0;text-align:center;width:65px}
.story-img{width:60px;height:60px;border-radius:12px;background:linear-gradient(45deg,#1877F2,#42A5F5);padding:2px}
.story-img div{width:100%;height:100%;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.story-img img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.story p{font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:#fff;margin-bottom:8px;box-shadow:0 1px 1px rgba(0,0,0,0.08)}
.create-box{padding:12px;display:flex;gap:10px;align-items:center}
.create-box img{width:40px;height:40px;border-radius:50%;background:#E4E6EB;object-fit:cover}
.create-box button{flex:1;text-align:left;background:#F0F2F5;border:none;padding:12px 16px;border-radius:20px;color:#65676B;font-size:15px}
.post-head{padding:12px;display:flex;gap:10px;align-items:center}
.post-head img{width:40px;height:40px;border-radius:50%;background:#E4E6EB;object-fit:cover}
.post-head-info{flex:1}
.post-head-info b{font-size:15px}
.post-head-info p{font-size:12px;color:#65676B}
.post-text{padding:0 12px 10px;font-size:15px;line-height:1.35}
.post-img{width:100%;max-height:500px;object-fit:cover;background:#F0F2F5;display:block}
.post-stats{padding:8px 12px;display:flex;justify-content:space-between;color:#65676B;font-size:13px;border-bottom:1px solid #E4E6EB}
.post-actions{display:flex}
.post-actions button{flex:1;background:none;border:none;padding:12px;font-weight:600;color:#65676B;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.bottom-nav{position:fixed;bottom:0;width:100%;max-width:500px;left:50%;transform:translateX(-50%);background:#fff;display:flex;border-top:1px solid #ddd;z-index:30}
.bottom-nav button{flex:1;padding:12px 0;border:none;background:#fff;color:#65676B;font-size:18px}
.bottom-nav button.active{color:#1877F2}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:50;display:flex;align-items:flex-end}
.modal-box{background:#fff;border-radius:12px 12px 0 0;padding:16px;width:100%;max-width:500px;margin:0 auto;max-height:90vh;overflow-y:auto}
.modal-box h2{font-size:20px;margin-bottom:12px}
.modal-box input,.modal-box select,.modal-box textarea{width:100%;padding:14px;margin:8px 0;border:none;background:#F0F2F5;border-radius:8px;font-size:16px}
.btn-blue{background:#1877F2;color:#fff;border:none;padding:14px;width:100%;border-radius:8px;font-size:16px;font-weight:700;margin-top:10px}
.btn-gray{background:#E4E6EB;color:#050505;border:none;padding:12px;width:100%;border-radius:8px;font-size:15px;font-weight:600;margin-top:8px}
.empty{text-align:center;padding:40px 20px;background:#fff;margin-bottom:8px;color:#65676B}
.people-card{display:flex;gap:10px;padding:12px;align-items:center;background:#fff;margin-bottom:1px}
.people-card img{width:60px;height:60px;border-radius:50%;background:#E4E6EB;object-fit:cover}
.people-info{flex:1}
.people-info b{font-size:15px}
.people-info p{font-size:12px;color:#65676B}
.people-card button{background:#E7F3FF;color:#1877F2;border:none;padding:8px 16px;border-radius:6px;font-weight:700;font-size:13px}
</style>
</head>
<body>
<div class="fb-top"><h1>NG Meet</h1><div class="fb-top-icons"><div>🔍</div><div onclick="openSignup()">👤</div><div>💬</div></div></div>
<div class="lang-strip">
<button id="l-en" onclick="setLang('en')" class="active">English</button>
<button id="l-pg" onclick="setLang('pg')">Pidgin</button>
<button id="l-yo" onclick="setLang('yo')">Yoruba</button>
<button id="l-ig" onclick="setLang('ig')">Igbo</button>
<button id="l-ha" onclick="setLang('ha')">Hausa</button>
</div>
<div class="main" id="app"></div>
<div class="bottom-nav">
<button id="nav_home" onclick="showPage('home')" class="active">🏠</button>
<button id="nav_people" onclick="showPage('people')">👥</button>
<button id="nav_post" onclick="showPage('create')">➕</button>
<button id="nav_profile" onclick="showPage('profile')">👤</button>
</div>

<script>
let curLang = localStorage.getItem('ngm_lang')||'en';
let dict={
en:{whats:"What's on your mind?",write:"Write something...",create:"Create story",post:"Post",people:"People who signed up",noPeople:"No people yet - Be the first to sign up! Only real people appear here like Facebook",addFriend:"Add",like:"Like",comment:"Comment",share:"Share",likes:"likes",noPost:"No posts yet. Tap + to create first post like Facebook!"},
pg:{whats:"Wetin dey your mind?",write:"Write something...",create:"Create story",post:"Post",people:"People wey don sign up",noPeople:"No people yet - Na you go first!",addFriend:"Add",like:"Like",comment:"Comment",share:"Share",likes:"likes",noPost:"No post yet. Press + make you post first!"},
yo:{whats:"Kini o wa lori okan re?",write:"Ko nkan...",create:"Da itan",post:"Firanse",people:"Eniyan",noPeople:"Ko si eniyan",addFriend:"Fi kun",like:"Feran",comment:"Asọye",share:"Pin",likes:"feran",noPost:"Ko si post sibẹsibẹ"},
ig:{whats:"Gini di n'obi gi?",write:"Dee ihe...",create:"Mepụta akụkọ",post:"Bipụta",people:"Ndi mmadu",noPeople:"Onweghi onye",addFriend:"Tinye",like:"Masịrị",comment:"Ikwu",share:"Kekọrịta",likes:"masịrị",noPost:"Onwebeghi post"},
ha:{whats:"Me ke cikin zuciyarka?",write:"Rubuta...",create:"Kirkiro labari",post:"Buga",people:"Mutane",noPeople:"Babu mutane",addFriend:"Ara",like:"So",comment:"Sharhi",share:"Raba",likes:"so",noPost:"Babu post tukuna"}
};
function t(k){return (dict[curLang]&&dict[curLang][k])||dict['en'][k]||k}
function setLang(l){curLang=l; localStorage.setItem('ngm_lang',l); document.querySelectorAll('.lang-strip button').forEach(b=>b.classList.remove('active')); document.getElementById('l-'+l).classList.add('active'); showPage(currentPage)}

let users = JSON.parse(localStorage.getItem('ngm_users_final')||'[]');
let posts = JSON.parse(localStorage.getItem('ngm_posts_final')||'[]');
let currentUser = JSON.parse(localStorage.getItem('ngm_current_final')||'null');
let currentPage='home';
function save(){localStorage.setItem('ngm_users_final',JSON.stringify(users));localStorage.setItem('ngm_posts_final',JSON.stringify(posts));if(currentUser)localStorage.setItem('ngm_current_final',JSON.stringify(currentUser))}

function showPage(p){
currentPage=p;
document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.remove('active'));
document.getElementById('nav_'+p).classList.add('active');
if(p==='home')renderHome();
if(p==='people')renderPeople();
if(p==='create')renderCreate();
if(p==='profile')renderProfile();
}

function renderHome(){
let userImg = currentUser&&currentUser.photo?currentUser.photo:'https://via.placeholder.com/100/1877F2/FFFFFF?text=U';
let html=`
<div class="card"><div class="create-box"><img src="${userImg}"><button onclick="showPage('create')">${t('whats')} ${currentUser?currentUser.name.split(' ')[0]:''}</button><span>📷</span></div></div>
<div class="card"><div class="story-row">
<div class="story" onclick="showPage('create')"><div class="story-img"><div>➕</div></div><p>${t('create')}</p></div>
${users.slice(0,10).map(u=>`<div class="story"><div class="story-img"><img src="${u.photo||'https://via.placeholder.com/100/1877F2/FFFFFF?text='+encodeURIComponent(u.name[0])}"></div><p>${u.name.split(' ')[0]}</p></div>`).join('')}
</div></div>
`;
if(posts.length===0)html+=`<div class="empty"><h3>${t('noPost')}</h3><p style="margin-top:8px">Only real people wey sign up go dey here. No bot.</p></div>`;
posts.slice().reverse().forEach((po,i)=>{
 let idx=posts.length-1-i;
 let u=users.find(x=>x.phone===po.phone)||po;
 html+=`<div class="card">
<div class="post-head"><img src="${u.photo||'https://via.placeholder.com/100/1877F2/FFFFFF?text='+encodeURIComponent((u.name||'U')[0])}"><div class="post-head-info"><b>${u.name}</b><p>${po.work||u.work||''} • ${po.location||u.location||''} • ${new Date(po.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} • 🌎</p></div><div>•••</div></div>
<div class="post-text">${po.text}</div>
${po.image?`<img class="post-img" src="${po.image}">`:''}
<div class="post-stats"><span>👍 ${po.likes||0} ${t('likes')}</span><span>${po.comments||0} comments</span></div>
<div class="post-actions"><button onclick="likePost(${idx})">👍 ${t('like')}</button><button>💬 ${t('comment')}</button><button>↗️ ${t('share')}</button></div>
</div>`;
});
document.getElementById('app').innerHTML=html;
}

function renderPeople(){
let html=`<div class="card" style="padding:12px"><b>${t('people')} (${users.length})</b><p style="font-size:12px;color:#65676B;margin-top:4px">${t('noPeople')}</p></div>`;
if(users.length===0)html+=`<div class="empty"><h3>No people yet</h3><p>Be first to sign up - No bot, only real people like Facebook</p><button class="btn-blue" onclick="openSignup()">Sign Up Now</button></div>`;
users.slice().reverse().forEach(u=>{
 html+=`<div class="people-card"><img src="${u.photo||'https://via.placeholder.com/100/1877F2/FFFFFF?text='+encodeURIComponent(u.name[0])}"><div class="people-info"><b>${u.name}</b><p>${u.work} • ${u.location}</p><p>${u.bio||''}</p></div><button>${t('addFriend')}</button></div>`;
});
document.getElementById('app').innerHTML=html;
}

function renderCreate(){
if(!currentUser){document.getElementById('app').innerHTML=`<div class="empty"><h3>Please Sign Up First</h3><p>Only real people wey sign up fit post - Like Facebook</p><button class="btn-blue" onclick="openSignup()">Sign Up</button><button class="btn-gray" onclick="openLogin()">Log In</button></div>`;return}
document.getElementById('app').innerHTML=`<div class="card" style="padding:12px">
<div style="display:flex;gap:10px;align-items:center"><img src="${currentUser.photo||'https://via.placeholder.com/100/1877F2/FFFFFF?text=U'}" style="width:40px;height:40px;border-radius:50%"><b>${currentUser.name}</b><span style="background:#E4E6EB;padding:4px 8px;border-radius:4px;font-size:12px">🌎 Public</span></div>
<textarea id="post_text" placeholder="${t('whats')} ${currentUser.name}?" style="width:100%;height:140px;margin:12px 0;border:none;font-size:18px;resize:none;outline:none" autofocus></textarea>
<input id="post_img" placeholder="Paste photo link here to add photo like Facebook - e.g. https://..." style="width:100%;padding:12px;background:#F0F2F5;border:none;border-radius:8px">
<p style="font-size:11px;color:#65676B;margin:6px 0">How to add photo like Facebook: Go Google Images, copy image link, paste here</p>
<div style="margin-top:12px;border:1px solid #E4E6EB;border-radius:8px;padding:10px;display:flex;justify-content:space-between"><span>Add to your post</span><span>📷 🎥 😊 📍</span></div>
<button class="btn-blue" onclick="doPost()">${t('post')}</button><button class="btn-gray" onclick="showPage('home')">Cancel</button>
</div>`;
}

function renderProfile(){
if(!currentUser){document.getElementById('app').innerHTML=`<div class="empty"><h3>No profile yet</h3><button class="btn-blue" onclick="openSignup()">Sign Up</button></div>`;return}
let myPosts = posts.filter(p=>p.phone===currentUser.phone);
document.getElementById('app').innerHTML=`
<div class="card" style="padding:0">
<div style="height:180px;background:linear-gradient(#1877F2,#42A5F5)"></div>
<div style="padding:0 16px 16px">
<img src="${currentUser.photo||'https://via.placeholder.com/120/1877F2/FFFFFF?text='+encodeURIComponent(currentUser.name[0])}" style="width:90px;height:90px;border-radius:50%;border:4px solid #fff;margin-top:-45px;background:#fff">
<h2>${currentUser.name}</h2><p>${currentUser.work} • ${currentUser.location}</p>
<p style="margin:8px 0;color:#050505">${currentUser.bio||''}</p>
<div style="display:flex;gap:8px;margin-top:12px"><button class="btn-blue" style="flex:1">➕ Add to Story</button><button class="btn-gray" style="flex:1">✏️ Edit Profile</button></div>
<button class="btn-gray" onclick="logout()">Log Out</button>
</div>
</div>
<div class="card" style="padding:12px"><b>Posts (${myPosts.length}) • Friends (${users.length-1}) • Only real people</b></div>
${myPosts.reverse().map(p=>`<div class="card"><div style="padding:12px">${p.text}${p.image?`<img src="${p.image}" style="width:100%;margin-top:8px;border-radius:8px">`:''}</div></div>`).join('')}
`;
}

function openSignup(){
document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modal-box"><h2>Create Account</h2><p>Only real people who sign up will appear here, just like Facebook. No bots.</p><input id="su_name" placeholder="Full Name"><input id="su_phone" placeholder="Phone - 080... (you will use this to login)"><select id="su_work"><option>Artist</option><option>Content Creator</option><option>Barber</option><option>Tailor</option><option>Fashion Designer</option><option>Makeup Artist</option><option>Photographer</option><option>Plumber</option><option>Electrician</option><option>Carpenter</option><option>DJ</option><option>Others</option></select><input id="su_location" placeholder="Location - Lagos, Abuja, etc"><input id="su_photo" placeholder="Profile Photo Link - paste image link"><textarea id="su_bio" placeholder="Bio - What do you do? Artist, Barber, Tailor..." style="height:70px"></textarea><button class="btn-blue" onclick="doSignup()">Sign Up</button><button class="btn-gray" onclick="closeModal()">Cancel</button></div></div>`);
}
function openLogin(){
document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="modal-box"><h2>Log In</h2><p>Enter your phone number</p><input id="li_phone" placeholder="080..."><button class="btn-blue" onclick="doLogin()">Continue</button><button class="btn-gray" onclick="closeModal()">Cancel</button></div></div>`);
}
function closeModal(){let m=document.getElementById('modal'); if(m)m.remove()}
function doSignup(){
let u={name:document.getElementById('su_name').value.trim(),phone:document.getElementById('su_phone').value.trim(),work:document.getElementById('su_work').value,location:document.getElementById('su_location').value||'Nigeria',photo:document.getElementById('su_photo').value.trim(),bio:document.getElementById('su_bio').value.trim()};
if(!u.name||!u.phone){alert('Fill name and phone');return}
if(users.find(x=>x.phone===u.phone)){alert('Phone already exists, please log in');return}
users.push(u); currentUser=u; save(); closeModal(); showPage('home');
}
function doLogin(){
let ph=document.getElementById('li_phone').value.trim();
let u=users.find(x=>x.phone===ph);
if(!u){alert('Account not found, please sign up');return}
currentUser=u; save(); closeModal(); showPage('home');
}
function logout(){currentUser=null; localStorage.removeItem('ngm_current_final'); showPage('home')}
function doPost(){
let text=document.getElementById('post_text').value.trim();
let img=document.getElementById('post_img').value.trim();
if(!text&&!img){alert('Write something or add photo');return}
posts.push({name:currentUser.name,phone:currentUser.phone,work:currentUser.work,location:currentUser.location,photo:currentUser.photo,text:text,image:img,time:Date.now(),likes:0,comments:0});
save(); showPage('home');
}
function likePost(i){posts[i].likes=(posts[i].likes||0)+1; save(); renderHome()}

showPage('home');
</script>
</body>
</html>
