<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NG-MEET - Perfect Real Chat</title>
<script src="https://meet.ffmuc.net/external_api.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui;background:#f0f2f5}
.top{position:sticky;top:0;background:#0a7cff;color:#fff;padding:14px;text-align:center;font-weight:900}
.tabs{display:flex;gap:6px;padding:8px;background:#fff}
.tab{flex:1;padding:12px;border-radius:10px;border:1px solid #ddd;background:#fff;font-weight:700}
.tab.active{background:#0a7cff;color:#fff}
.card{background:#fff;margin:10px;border-radius:14px;padding:12px;box-shadow:0 2px 8px #0001}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font-size:15px}
.btn{width:100%;padding:12px;border:none;border-radius:10px;background:#0a7cff;color:#fff;font-weight:800}
.btn-green{background:#22c55e}
.badge{display:inline-block;padding:6px 10px;background:#e8f0ff;border-radius:20px;margin:4px;font-size:13px}
#messages{height:300px;overflow:auto;background:#f9fbff;border-radius:10px;padding:10px}
.msg{padding:8px 10px;margin:6px 0;background:#fff;border-radius:10px}
.me{background:#0a7cff;color:#fff;text-align:right}
.post{padding:10px;border-top:1px solid #eee}
.small{font-size:12px;color:#666}
#jitsi{width:100%;height:500px;display:none;background:#000;border-radius:12px;margin-top:10px}
</style>
</head>
<body>
<div class="top">NG-MEET 🇳🇬 PERFECT - Real People Only</div>

<div id="auth" class="card">
<h3>Join Now - Real People Only</h3>
<input id="uName" placeholder="Your Name e.g Ola">
<input id="uEmail" placeholder="Email e.g ola@gmail.com">
<button class="btn" onclick="doJoin()">Sign Up & Enter</button>
<p class="small">Anybody wey sign up go appear online, no bot! Chat live!</p>
</div>

<div id="app" style="display:none">
<div class="tabs">
<button id="tb1" class="tab active" onclick="showTab('home')">Home</button>
<button id="tb2" class="tab" onclick="showTab('chat')">Chat</button>
<button id="tb3" class="tab" onclick="showTab('meet')">Meet</button>
</div>

<div id="homeTab" class="card">
<textarea id="postTxt" placeholder="Wetin dey your mind?"></textarea>
<button class="btn" onclick="doPost()">Post</button>
<div id="feed"></div>
</div>

<div id="chatTab" class="card" style="display:none">
<div>Welcome <b id="myName"></b> | Online: <b id="onlineCount">1</b></div>
<div id="users"></div>
<div id="messages"></div>
<input id="chatInput" placeholder="Type message...">
<button class="btn btn-green" onclick="sendChat()">Send Live</button>
</div>

<div id="meetTab" class="card" style="display:none">
<button class="btn btn-green" onclick="startMeet()">Start Video Meeting</button>
<div id="jitsi"></div>
</div>
</div>

<script>
const TOPIC='ng-meet-perfect-ola-2026-live';
let myName=localStorage.getItem('ng_name')||'';
let posts=JSON.parse(localStorage.getItem('ng_posts')||'[]');
let onlineSet=new Set();

function doJoin(){
 let n=document.getElementById('uName').value.trim();
 let e=document.getElementById('uEmail').value.trim();
 if(!n||!e){alert('Put name and email');return;}
 localStorage.setItem('ng_name',n);
 localStorage.setItem('ng_email',e);
 myName=n; boot();
}
function boot(){
 if(!localStorage.getItem('ng_name')) return;
 myName=localStorage.getItem('ng_name');
 document.getElementById('auth').style.display='none';
 document.getElementById('app').style.display='block';
 document.getElementById('myName').innerText=myName;
 renderFeed();
 onlineSet.add(myName); updateOnline();
 fetch(`https://ntfy.sh/${TOPIC}`,{method:'POST',body:`JOIN:${myName}`});
 listen();
}
function showTab(t){
 document.getElementById('homeTab').style.display=t==='home'?'block':'none';
 document.getElementById('chatTab').style.display=t==='chat'?'block':'none';
 document.getElementById('meetTab').style.display=t==='meet'?'block':'none';
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 document.getElementById(t==='home'?'tb1':t==='chat'?'tb2':'tb3').classList.add('active');
}
function renderFeed(){
 document.getElementById('feed').innerHTML=posts.map(p=>`<div class="post"><b>${p.name}</b><br>${p.text}<br><span class="small">${p.time}</span></div>`).join('');
}
function doPost(){
 let txt=document.getElementById('postTxt').value.trim(); if(!txt)return;
 let obj={name:myName,text:txt,time:new Date().toLocaleTimeString()};
 posts.unshift(obj); localStorage.setItem('ng_posts',JSON.stringify(posts));
 document.getElementById('postTxt').value=''; renderFeed();
}
function listen(){
 const es=new EventSource(`https://ntfy.sh/${TOPIC}/sse`);
 es.onmessage=ev=>{
  let d=ev.data; if(!d) return;
  if(d.startsWith('JOIN:')){ let n=d.replace('JOIN:',''); onlineSet.add(n); updateOnline(); addChat(n+' don join NG-MEET! 🟢',false); }
  if(d.startsWith('CHAT:')){ addChat(d.replace('CHAT:',''),false); }
 };
}
function updateOnline(){
 let uniq=[...new Set([...onlineSet])];
 document.getElementById('onlineCount').innerText=uniq.length;
 document.getElementById('users').innerHTML=uniq.map(n=>`<span class="badge">${n} 🟢</span>`).join('');
}
function addChat(text,isMe){
 let m=document.getElementById('messages'); let div=document.createElement('div');
 div.className=isMe?'msg me':'msg'; div.innerText=text; m.appendChild(div); m.scrollTop=m.scrollHeight;
}
function sendChat(){
 let t=document.getElementById('chatInput').value.trim(); if(!t)return;
 let full=`CHAT:${myName}: ${t}`;
 fetch(`https://ntfy.sh/${TOPIC}`,{method:'POST',body:full});
 addChat(`${myName}: ${t}`,true);
 document.getElementById('chatInput').value='';
}
function startMeet(){
 let room='NGMEET'+Math.floor(Math.random()*9000);
 document.getElementById('jitsi').style.display='block';
 document.getElementById('jitsi').innerHTML='';
 new JitsiMeetExternalAPI('meet.ffmuc.net',{roomName:room,parentNode:document.getElementById('jitsi'),width:'100%',height:500});
 alert('Share link: https://meet.ffmuc.net/'+room);
}
boot();
</script>
</body>
</html>
