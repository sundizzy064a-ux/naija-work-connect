<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naija Work Connect - LIVE Meet</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<meta property="og:title" content="Naija Work Connect - LIVE Meet">
<meta property="og:description" content="Live chat, meet workers, post jobs instantly in Lagos!">
<meta property="og:image" content="https://sundizzy064a-ux.github.io/naija-work-connect/logo.png">
<meta name="theme-color" content="#16a34a">
<link rel="icon" href="logo.png">
<style>
body{background:#0a0a0a;color:#fff;font-family:Inter,system-ui}
.glass{background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1)}
.live-dot{width:8px;height:8px;background:#22c55e;border-radius:50%;animation:pulse 1.5s infinite;display:inline-block}
@keyframes pulse{0%{box-shadow:0 0 0 0 #22c55e}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.logo-ng{width:40px;height:40px;background:#16a34a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:18px}
.msg-me{background:#16a34a;color:#000;margin-left:auto}
.msg-other{background:#1e1e1e;border:1px solid #2a2a2a}
</style>
</head>
<body>
<header class="sticky top-0 z-50 bg-black/90 border-b border-white/10 p-3">
<div class="max-w-6xl mx-auto flex justify-between items-center">
<div class="flex items-center gap-3"><div class="logo-ng">NG</div><div><h1 class="font-black leading-none text-sm">NAIJA WORK CONNECT</h1><div class="text-xs text-green-400 flex items-center gap-1"><span class="live-dot"></span><span id="liveCount">LIVE • 3 online</span></div></div></div>
<button onclick="openPost()" class="bg-white text-black px-4 py-2 rounded-full font-bold text-xs">+ POST</button>
</div>
<div class="max-w-6xl mx-auto flex gap-2 mt-3">
<button onclick="tab='jobs';render()" id="tabJobs" class="flex-1 bg-white text-black py-2 rounded-full text-xs font-bold">💼 Jobs</button>
<button onclick="tab='chat';render()" id="tabChat" class="flex-1 glass py-2 rounded-full text-xs font-bold">💬 LIVE Chat <span id="chatBadge" class="bg-green-500 text-black px-2 rounded-full ml-1">LIVE</span></button>
<button onclick="tab='people';render()" id="tabPeople" class="flex-1 glass py-2 rounded-full text-xs font-bold">👥 People</button>
</div>
</header>

<div class="max-w-6xl mx-auto p-3 pb-20">
<div id="jobsSection"></div>
<div id="chatSection" class="hidden">
<div class="glass rounded-2xl p-3 mb-3 flex items-center gap-2 text-xs"><span class="live-dot"></span><span id="onlineText">12 people dey inside chat now - everybody go see your message!</span></div>
<div id="chatMessages" class="space-y-2 max-h-[60vh] overflow-y-auto p-2"></div>
<div class="fixed bottom-0 left-0 right-0 max-w-6xl mx-auto p-3 bg-black border-t border-white/10 flex gap-2">
<input id="chatName" placeholder="Your name" class="w-24 bg-white/10 border border-white/10 rounded-full px-4 py-3 text-xs outline-none">
<input id="chatInput" onkeypress="if(event.key==='Enter')sendMsg()" placeholder="Type message... everybody go see am!" class="flex-1 bg-white/10 border border-white/10 rounded-full px-5 py-3 text-sm outline-none">
<button onclick="sendMsg()" class="bg-green-500 text-black w-12 h-12 rounded-full font-bold"><i class="fa fa-paper-plane"></i></button>
</div>
</div>
<div id="peopleSection" class="hidden"></div>
</div>

<div id="postModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-end md:items-center justify-center">
<div class="bg-[#1a1a1a] w-full md:max-w-lg rounded-t-3xl md:rounded-2xl p-5 border border-white/10">
<div class="flex justify-between mb-4"><h3 class="font-bold">Post Job LIVE</h3><button onclick="closePost()" class="w-8 h-8 rounded-full bg-white/10">x</button></div>
<div class="space-y-3">
<input id="pTitle" placeholder="Job Title" class="w-full bg-white/10 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none">
<select id="pCat" class="w-full bg-[#1a1a1a] border border-white/10 rounded-xl px-4 py-3 text-sm"><option value="cleaning">Cleaning</option><option value="plumbing">Plumbing</option><option value="electrical">Electrical</option><option value="laundry">Laundry</option></select>
<select id="pLoc" class="w-full bg-[#1a1a1a] border border-white/10 rounded-xl px-4 py-3 text-sm"><option>Ikeja</option><option>Lekki</option><option>Yaba</option><option>Surulere</option></select>
<input id="pPrice" type="number" placeholder="Price" class="w-full bg-white/10 border border-white/10 rounded-xl px-4 py-3 text-sm">
<textarea id="pDesc" placeholder="Describe..." rows="2" class="w-full bg-white/10 border border-white/10 rounded-xl px-4 py-3 text-sm"></textarea>
<input id="pPhone" placeholder="WhatsApp" class="w-full bg-white/10 border border-white/10 rounded-xl px-4 py-3 text-sm">
<button onclick="postJob()" class="w-full bg-green-500 text-black font-bold py-3 rounded-xl">POST LIVE!</button>
</div>
</div>
</div>

<script>
const API="https://crudcrud.com/api/1681de00cc2541829e1f7b9eef1e467e";
let tab='chat';
let jobs=JSON.parse(localStorage.getItem('naija_jobs')||'null')||[{id:1,title:"House Cleaning",cat:"cleaning",loc:"Lekki",price:25000,desc:"Urgent",phone:"08012345678",time:Date.now()}];
let messages=JSON.parse(localStorage.getItem('naija_msgs')||'null')||[{name:"Admin",text:"Welcome to Naija Work Connect LIVE! Everybody dey see each other here! 🔥",time:Date.now()-60000},{name:"Sundizzy",text:"If you open app now, you go see this chat LIVE!",time:Date.now()-30000}];
let myName=localStorage.getItem('myName')||'';
function saveJobs(){localStorage.setItem('naija_jobs',JSON.stringify(jobs));}
function saveMsgs(){localStorage.setItem('naija_msgs',JSON.stringify(messages.slice(-50)));localStorage.setItem('myName',myName);}

async function loadLive(){
 try{
  let r=await fetch(API+'/profiles');if(r.ok){let d=await r.json();if(d.length>0)jobs=d.map(x=>({id:x._id,title:x.name,cat:x.skill||'cleaning',loc:x.location||'Lekki',price:x.bio||5000,desc:x.whatsapp||'',phone:x.whatsapp||'',time:Date.now()}));}
  let r2=await fetch(API+'/messages');if(r2.ok){let m=await r2.json();if(m.length>0)messages=m.map(x=>({name:x.name,text:x.text,time:x.time||Date.now()}));}
 }catch(e){}
 render();
}
function render(){
 document.getElementById('tabJobs').className=tab=='jobs'?'flex-1 bg-white text-black py-2 rounded-full text-xs font-bold':'flex-1 glass py-2 rounded-full text-xs font-bold';
 document.getElementById('tabChat').className=tab=='chat'?'flex-1 bg-white text-black py-2 rounded-full text-xs font-bold':'flex-1 glass py-2 rounded-full text-xs font-bold';
 document.getElementById('tabPeople').className=tab=='people'?'flex-1 bg-white text-black py-2 rounded-full text-xs font-bold':'flex-1 glass py-2 rounded-full text-xs font-bold';
 document.getElementById('jobsSection').classList.toggle('hidden',tab!=='jobs');
 document.getElementById('chatSection').classList.toggle('hidden',tab!=='chat');
 document.getElementById('peopleSection').classList.toggle('hidden',tab!=='people');
 if(tab=='jobs'){
  document.getElementById('jobsSection').innerHTML=`<div class="grid md:grid-cols-2 gap-3">${jobs.map(j=>`<div class="glass rounded-2xl p-4 border border-white/10"><div class="flex justify-between mb-1"><span class="text-xs bg-green-500/20 text-green-400 px-2 py-1 rounded-full">${j.cat} • ${j.loc}</span><span class="text-xs text-white/40">now</span></div><h3 class="font-bold text-sm">${j.title}</h3><p class="text-xs text-white/60 mb-2">${j.desc}</p><div class="flex justify-between"><span class="font-bold text-green-400 text-sm">₦${j.price}</span><a href="https://wa.me/234${(j.phone+'').slice(-10)}" target="_blank" class="bg-white text-black px-3 py-1 rounded-full text-xs font-bold">Chat</a></div></div>`).join('')}</div>`;
 }
 if(tab=='chat'){
  document.getElementById('chatMessages').innerHTML=messages.map(m=>{
   let isMe=myName&&m.name===myName;
   return `<div class="flex flex-col ${isMe?'items-end':'items-start'}"><div class="${isMe?'msg-me':'msg-other'} rounded-2xl px-4 py-2 max-w-[80%]"><div class="text-[10px] opacity-60 font-bold">${m.name}</div><div class="text-sm">${m.text}</div></div><div class="text-[10px] text-white/30 mt-1">${new Date(m.time).toLocaleTimeString()}</div></div>`;
  }).join('');
  let el=document.getElementById('chatMessages');el.scrollTop=el.scrollHeight;
  document.getElementById('onlineText').innerText=`${messages.length+3} people don chat - everybody dey see LIVE!`;
 }
 if(tab=='people'){
  let names=[...new Set(messages.map(m=>m.name))];
  document.getElementById('peopleSection').innerHTML=`<div class="glass rounded-2xl p-4"><h3 class="font-bold mb-3">People Wey Dey Online Now (${names.length})</h3><div class="space-y-3">${names.map(n=>`<div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-green-500 flex items-center justify-center font-bold text-black">${n[0]}</div><div><p class="font-bold text-sm">${n}</p><p class="text-xs text-green-400 flex items-center gap-1"><span class="live-dot"></span>Online now - dey inside chat</p></div><a href="https://wa.me/" class="ml-auto bg-white/10 px-3 py-1 rounded-full text-xs">Chat</a></div>`).join('')}</div></div>`;
 }
 document.getElementById('liveCount').innerText=`LIVE • ${messages.length} chats • ${jobs.length} jobs`;
 document.getElementById('chatName').value=myName;
}
async function sendMsg(){
 let name=document.getElementById('chatName').value||'Anon';
 let text=document.getElementById('chatInput').value;
 if(!text)return;
 myName=name;
 let msg={name,text,time:Date.now()};
 messages.push(msg);saveMsgs();
 document.getElementById('chatInput').value='';
 render();
 try{await fetch(API+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(msg)});}catch(e){}
 try{await fetch(API+'/profiles',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,skill:'chatting',location:'Lagos',whatsapp:text,bio:Date.now()})});}catch(e){}
}
function openPost(){document.getElementById('postModal').classList.remove('hidden');}
function closePost(){document.getElementById('postModal').classList.add('hidden');}
function postJob(){let j={id:Date.now(),title:document.getElementById('pTitle').value,cat:document.getElementById('pCat').value,loc:document.getElementById('pLoc').value,price:document.getElementById('pPrice').value||5000,desc:document.getElementById('pDesc').value,phone:document.getElementById('pPhone').value,time:Date.now()};if(!j.title)return alert('Add title');jobs.unshift(j);saveJobs();closePost();render();alert('Job don go LIVE! Everybody go see am!');}
render();loadLive();setInterval(loadLive,3000);
</script>
</body>
</html>
