<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial Black,Arial,sans-serif;background:#fff;color:#3E2723;padding-bottom:110px}
.header{background:#4E342E;color:#fff;padding:18px;text-align:center;position:sticky;top:0;z-index:20;border-bottom:6px solid #FFD54F}
.header h1{font-size:34px} .header p{font-size:18px;font-family:Arial}
.lang-bar{background:#3E2723;padding:10px;display:flex;gap:6px;overflow-x:auto;justify-content:center}
.lang-bar button{padding:10px 16px;border-radius:20px;border:2px solid #FFD54F;background:#fff;font-weight:900;font-size:14px;white-space:nowrap}
.lang-bar button.active{background:#FFD54F;color:#3E2723}
.perfect-bar{background:#FFD54F;color:#3E2723;padding:12px;text-align:center;font-weight:900;font-size:20px}
.container{padding:14px;max-width:700px;margin:auto}
.card{background:#fff;border:4px solid #4E342E;border-radius:22px;margin-bottom:20px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,0.2)}
.card img{width:100%;height:380px;object-fit:cover;background:#EFEBE9}
.card-body{padding:18px} .card-body h2{font-size:28px} .card-body p{font-size:20px;margin:6px 0;font-family:Arial}
.tag{display:inline-block;background:#4E342E;color:#FFD54F;padding:6px 14px;border-radius:30px;font-size:15px;font-weight:bold;margin:3px}
.btn{background:#4E342E;color:#fff;border:none;padding:18px;width:100%;border-radius:14px;font-size:23px;font-weight:900;margin-top:10px}
.btn-yellow{background:#FFD54F;color:#3E2723} .btn-green{background:#2E7D32;color:#fff} .btn-outline{background:#fff;color:#4E342E;border:4px solid #4E342E}
input,select,textarea{width:100%;padding:18px;margin:10px 0;border:4px solid #4E342E;border-radius:14px;font-size:20px;font-family:Arial;font-weight:bold}
.filter-bar{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.filter-bar button{white-space:nowrap;padding:10px 16px;border-radius:30px;border:3px solid #4E342E;background:#fff;font-weight:900;font-size:15px;flex-shrink:0}
.filter-bar button.active{background:#4E342E;color:#FFD54F}
.chat-box{border:4px solid #4E342E;height:340px;overflow-y:auto;padding:12px;border-radius:16px;background:#FFF8E1;margin:10px 0}
.bottom-nav{position:fixed;bottom:0;width:100%;max-width:700px;left:50%;transform:translateX(-50%);background:#4E342E;display:flex;gap:6px;padding:10px;z-index:20;border-top:4px solid #FFD54F}
.bottom-nav button{flex:1;padding:14px;border-radius:12px;border:none;font-weight:900;font-size:15px}
.share-box{background:#FFF8E1;border:4px dashed #4E342E;padding:14px;border-radius:18px;margin:12px 0;text-align:center}
</style>
</head>
<body>

</div>

pg:{hdr:"ARTIST • CONTENT • BARBER • TAILOR • EVERYBODY DEY",everybody:"Everybody",artist:"Artist",content:"Content Creator",barber:"Barber",tailor:"Tailor",home:"HOUSE",signup:"JOIN US",share:"SHARE AM",filter_all:"All of dem",public_title:"PUBLIC APP - SHARE MAKE EVERYBODY JOIN AM",public_desc:"Artist dey, Content dey, Barber, Tailor - once you join, you go show for house sharp sharp!",share_btn:"📤 SHARE APP LINK GIVE FRIEND",every_title:"Everybody Wey Dey",no_person:"No person for",be_first:"Na you go first!",chat_btn:"💬 GIST WITH",inside:"FOR INSIDE APP",public_gist:"💬 PUBLIC GIST - MAKE EVERYBODY GIST",type_public:"Type wetin you wan yarn for public...",send_public:"SEND AM FOR PUBLIC",signup_title:"📝 JOIN US - EVERYTHING DEY HERE",signup_desc:"Artist, Content, Barber, Tailor - Choose your hustle! You go show for house immediately!",name_ph:"Your Full Name",phone_ph:"Phone Number - 080...",location_ph:"Your Location - Lagos, Abuja, Anywhere",photo_ph:"Photo Link (you fit leave am)",bio_ph:"Wetin you dey do? Tell us...",signup_now:"✅ JOIN NOW - I GO SHOW FOR PUBLIC",back_home:"⬅️ GO BACK HOUSE",chat_with:"💬 GIST WITH",type_msg:"Type message...",send_inside:"SEND MESSAGE FOR INSIDE APP",back:"⬅️ BACK",your_name:"Your name na wetin?",you_be:"You be Artist, Content, Barber, Tailor?",filter_label:"Choose work"},
yo:{hdr:"ONISE AWORAN • CONTENT • AGBERUN • TAILOR • GBOGBO ENIYAN",everybody:"Gbogbo Eniyan",artist:"Onise Aworan",content:"Content Creator",barber:"Agberun",tailor:"Tailor",home:"ILE",signup:"FORUKO SILO",share:"PIN",filter_all:"Gbogbo",public_title:"PUBLIC APP - PIN FUN GBOGBO ENIYAN",public_desc:"Onise aworan wa, Content wa, Agberun wa - gbogbo eniyan yoo han nibi!",share_btn:"📤 PIN APP LINK",every_title:"Gbogbo Eniyan",no_person:"Ko si eniyan fun",be_first:"Iwo ni akoko!",chat_btn:"💬 BA SORO PELU",inside:"NINU APP",public_gist:"💬 GBOGBO ENIYAN NSORO",type_public:"Ko nkan fun gbogbo eniyan...",send_public:"RANSE SI GBOGBO ENIYAN",signup_title:"📝 FORUKO SILO - GBOGBO NKAN WA NIBI",signup_desc:"Onise aworan, Content, Agberun, Tailor - Yan ise re!",name_ph:"Oruko re ni kikun",phone_ph:"Nomba Foonu - 080...",location_ph:"Ibi ti o wa - Lagos, Abuja",photo_ph:"Linki Fọto",bio_ph:"Kini ise re?",signup_now:"✅ FORUKO SILO BAYI",back_home:"⬅️ PADA SI ILE",chat_with:"💬 BA SORO PELU",type_msg:"Ko ifiranse...",send_inside:"RANSE NINU APP",back:"⬅️ PADA",your_name:"Oruko re?",you_be:"Ise wo ni tire?",filter_label:"Yan ise"},
ig:{hdr:"ARTIST • CONTENT • BARBER • TAILOR • MMADU NILE",everybody:"Madu Nile",artist:"Artist",content:"Content Creator",barber:"Barber",tailor:"Tailor",home:"ULO",signup:"DEBANYE AHA",share:"KESAA",filter_all:"Nile",public_title:"PUBLIC APP - KESAA MEE MMADU NILE",public_desc:"Artist no, Content no, Barber, Tailor - onye obula ga-aputa ebe a!",share_btn:"📤 KESAA APP LINK",every_title:"Madu Nile",no_person:"Onweghi onye maka",be_first:"Burụ onye mbu!",chat_btn:"💬 KPAKORITA",inside:"N'IME APP",public_gist:"💬 MKPARITA NILE - MMADU NILE",type_public:"Dee ihe maka mmadu nile...",send_public:"ZIPU MAKA NDI NILE",signup_title:"📝 DEBANYE AHA - IHE NILE DI EBE A",signup_desc:"Artist, Content, Barber, Tailor - Họrọ ọrụ gi!",name_ph:"Aha gi n'uju",phone_ph:"Nomba ekwenti - 080...",location_ph:"Ebe i bi - Lagos, Abuja",photo_ph:"Link foto",bio_ph:"Kedu ọrụ i na-aru?",signup_now:"✅ DEBANYE AHA UGBU A",back_home:"⬅️ LAGHACHI ULO",chat_with:"💬 KPAKORITA",type_msg:"Dee ozi...",send_inside:"ZIPU OZI N'IME APP",back:"⬅️ LAGHACHI",your_name:"Aha gi?",you_be:"I bu Artist, Content, Barber, Tailor?",filter_label:"Họrọ ọrụ"},
ha:{hdr:"MAI ZANE • CONTENT • MAI ASKI • TAILOR • KOWA",everybody:"Kowa",artist:"Mai Zane",content:"Content Creator",barber:"Mai Aski",tailor:"Tailor",home:"GIDA",signup:"YI RAJISTA",share:"RABA",filter_all:"Duka",public_title:"PUBLIC APP - RABA GA KOWA",public_desc:"Mai zane yana, Content yana, Mai aski, Tailor - kowa zai bayyana anan!",share_btn:"📤 RABA LINK DIN APP",every_title:"Kowa",no_person:"Babu kowa don",be_first:"Ka zama na farko!",chat_btn:"💬 YI HIRA DA",inside:"CIKIN APP",public_gist:"💬 HIRAR JAMA'A - KOWA",type_public:"Rubuta hirar jama'a...",send_public:"AIKA GA JAMA'A",signup_title:"📝 YI RAJISTA - KOWA YANA NAN",signup_desc:"Mai zane, Content, Mai aski, Tailor - Zabi aikinka!",name_ph:"Cikakken sunanka",phone_ph:"Lambar Waya - 080...",location_ph:"Wurinka - Lagos, Abuja",photo_ph:"Link din hoto",bio_ph:"Me kake yi?",signup_now:"✅ YI RAJISTA YANZU",back_home:"⬅️ KOMA GIDA",chat_with:"💬 YI HIRA DA",type_msg:"Rubuta sako...",send_inside:"AIKA SAKO CIKIN APP",back:"⬅️ KOMA",your_name:"Sunanka?",you_be:"Kai Artist ne, Content, Barber, Tailor?",filter_label:"Zabi aiki"}
};
function t(k){return dict[curLang][k]||dict['en'][k]||k}
function setLang(l){curLang=l; localStorage.setItem('ng_lang',l); document.querySelectorAll('.lang-bar button').forEach(b=>b.classList.remove('active')); document.getElementById('btn-'+l).classList.add('active'); applyLang(); renderHome();}
function applyLang(){document.getElementById('hdr_sub').innerText=t('hdr'); document.getElementById('top_bar').innerText='🔥 '+t('filter_label').toUpperCase()+' - PEOPLE FIT CHANGE LANGUAGE - '+curLang.toUpperCase()+' 🔥'; document.getElementById('nav_home').innerText=t('home'); document.getElementById('nav_signup').innerText=t('signup'); document.getElementById('nav_share').innerText=t('share');}

let workers = JSON.parse(localStorage.getItem('ng_lang_final')||'[{"name":"OLA - ARTIST","work":"Artist","location":"Sagamu","phone":"080...","bio":"Professional Artist - draw, paint, design","photo":"","cat":"Artist"},{"name":"Tolu - CONTENT","work":"Content Creator","location":"Lagos","phone":"081...","bio":"Content creator TikTok Instagram YouTube","photo":"","cat":"Content"},{"name":"Baba Barbing","work":"Barber","location":"Ikeja","phone":"080...","bio":"Sharp barbing clean cut","photo":"","cat":"Barber"},{"name":"Mama Tailor","work":"Tailor","location":"Abeokuta","phone":"090...","bio":"Sew native English aso-ebi","photo":"","cat":"Tailor"}]');
let chats = JSON.parse(localStorage.getItem('ng_lang_chat')||'{}');
let currentFilter='All';
function save(){localStorage.setItem('ng_lang_final',JSON.stringify(workers));localStorage.setItem('ng_lang_chat',JSON.stringify(chats))}
function showPage(p){if(p==='home')renderHome();if(p==='signup')renderSignup()}
function renderHome(){
let cats = ['All','Artist','Content','Barber','Tailor','Fashion Designer','Makeup Artist','Photographer','Plumber','Electrician','Carpenter','Painter','DJ','Others'];
let html=`<div class="share-box"><h2 style="font-size:24px">${t('public_title')}</h2><p style="font-size:18px;font-family:Arial;margin:8px 0">${t('public_desc')}</p><button class="btn btn-yellow" onclick="shareApp()">${t('share_btn')}</button></div>`;
html+=`<div class="filter-bar">`+cats.map(c=>`<button class="${currentFilter===c?'active':''}" onclick="filterCat('${c}')">${c==='All'?t('filter_all'):c.toUpperCase()}</button>`).join('')+`</div>`;
let filtered = currentFilter==='All'?workers:workers.filter(w=>w.cat===currentFilter||w.work===currentFilter);
html+=`<h2 style="font-size:26px;margin:14px 0">👥 ${t('every_title')} (${filtered.length}) - ${currentFilter.toUpperCase()}</h2>`;
if(filtered.length===0)html+=`<div style="padding:40px;text-align:center;font-size:22px;border:4px dashed #4E342E;border-radius:22px">${t('no_person')} ${currentFilter}. ${t('be_first')}</div>`;
filtered.slice().reverse().forEach(w=>{
 let realIdx=workers.indexOf(w);
 html+=`<div class="card"><img src="${w.photo||'https://via.placeholder.com/600x600/4E342E/FFD54F?text='+encodeURIComponent(w.name)}"><div class="card-body"><span class="tag">✨ ${w.cat||w.work}</span><h2>${w.name}</h2><p>🔧 <b>${w.work.toUpperCase()}</b></p><p>📍 ${w.location}</p><p>📞 ${w.phone}</p><p>📝 ${w.bio}</p><button class="btn" onclick="openChat(${realIdx})">${t('chat_btn')} ${w.name.split(' ')[0].toUpperCase()} ${t('inside')}</button></div></div>`;
});
html+=`<div style="margin-top:18px"><h2 style="font-size:24px">${t('public_gist')}</h2><div class="chat-box" id="publicBox"></div><input id="publicInput" placeholder="${t('type_public')}"><button class="btn" onclick="sendPublic()">${t('send_public')}</button></div>`;
document.getElementById('app').innerHTML=html; renderPublic();
}
function filterCat(c){currentFilter=c; renderHome()}
function renderSignup(){
document.getElementById('app').innerHTML=`<div style="background:#FFF8E1;border:4px solid #4E342E;padding:20px;border-radius:22px"><h2 style="font-size:30px">${t('signup_title')}</h2><p style="font-size:18px;font-family:Arial;margin:10px 0">${t('signup_desc')}</p><input id="s_name" placeholder="${t('name_ph')}"><input id="s_phone" placeholder="${t('phone_ph')}"><select id="s_work"><option value="Artist">🎨 ${t('artist')}</option><option value="Content">🎥 ${t('content')}</option><option value="Barber">✂️ ${t('barber')}</option><option value="Tailor">👗 ${t('tailor')}</option><option value="Fashion Designer">👚 Fashion Designer</option><option value="Makeup Artist">💄 Makeup Artist</option><option value="Photographer">📸 Photographer</option><option value="Plumber">🔧 Plumber</option><option value="Electrician">💡 Electrician</option><option value="Carpenter">🪚 Carpenter</option><option value="Painter">🎨 Painter</option><option value="DJ">🎧 DJ / MC</option><option value="Others">⭐ Others</option></select><input id="s_location" placeholder="${t('location_ph')}"><input id="s_photo" placeholder="${t('photo_ph')}"><textarea id="s_bio" placeholder="${t('bio_ph')}"></textarea><button class="btn btn-green" onclick="doSignup()">${t('signup_now')}</button><button class="btn btn-outline" onclick="showPage('home')">${t('back_home')}</button></div>`;
}
function doSignup(){
let workVal=document.getElementById('s_work').value;
let w={name:document.getElementById('s_name').value,phone:document.getElementById('s_phone').value,work:workVal,cat:workVal,location:document.getElementById('s_location').value||'Nigeria',photo:document.getElementById('s_photo').value,bio:document.getElementById('s_bio').value};
if(!w.name||!w.phone){alert('Fill Name and Phone! / Abeg fill Name and Phone!');return} workers.push(w); save(); alert('PERFECT! / Oya you don join! You don dey PUBLIC!'); showPage('home');
}
function openChat(i){let w=workers[i];currentChat=i;document.getElementById('app').innerHTML=`<div class="card"><div class="card-body"><button class="btn btn-outline" onclick="showPage('home')">${t('back')}</button><h2>${t('chat_with')} ${w.name}</h2><p><span class="tag">${w.work}</span> 📍 ${w.location}</p><div class="chat-box" id="chatBox"></div><input id="chatInput" placeholder="${t('type_msg')}"><button class="btn" onclick="sendMsg()">${t('send_inside')}</button></div></div>`; renderChat();}
function renderChat(){let box=document.getElementById('chatBox'); if(!box)return; let key='chat_'+currentChat; let msgs=chats[key]||[]; box.innerHTML=msgs.map(m=>`<div style="padding:14px;margin:10px 0;background:${m.me?'#4E342E':'#fff'};color:${m.me?'#fff':'#3E2723'};border-radius:14px;border:3px solid #4E342E;font-size:21px;font-family:Arial">${m.text}</div>`).join(''); box.scrollTop=box.scrollHeight}
function sendMsg(){let inp=document.getElementById('chatInput'); if(!inp.value)return; let key='chat_'+currentChat; if(!chats[key])chats[key]=[]; chats[key].push({text:inp.value,me:true}); setTimeout(()=>{chats[key].push({text:'Thanks! I be '+workers[currentChat].work+' for '+workers[currentChat].location,me:false}); save(); renderChat();},800); inp.value=''; save(); renderChat();}
let publicChats=JSON.parse(localStorage.getItem('ng_public_lang_chat')||'[]');
function renderPublic(){let box=document.getElementById('publicBox'); if(!box)return; box.innerHTML=publicChats.map(m=>`<div style="padding:12px;margin:8px 0;background:#fff;border:3px solid #4E342E;border-radius:12px;font-size:19px;font-family:Arial"><b>${m.name}:</b> ${m.text}</div>`).join(''); box.scrollTop=box.scrollHeight}
function sendPublic(){let inp=document.getElementById('publicInput'); if(!inp.value)return; let name=prompt(t('your_name'))||'Guest'; publicChats.push({name:name,text:inp.value}); localStorage.setItem('ng_public_lang_chat',JSON.stringify(publicChats)); inp.value=''; renderPublic();}
function shareApp(){let link='https://sundizzy064a-ux.github.io/naija-work-connect/'; if(navigator.share){navigator.share({title:'NG MEET',text:t('public_desc'),url:link})} else {prompt('Copy link:',link)}}
applyLang(); renderHome();
</script>
</body>
